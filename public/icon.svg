<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bubbleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bubblePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Golden 4-point star accent at top right -->
  <path d="M 334 104 C 334 116 342 124 354 124 C 342 124 334 132 334 144 C 334 132 326 124 314 124 C 326 124 334 116 334 104 Z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- Back Language Bubble '文' -->
  <g transform="translate(345, 230)">
    <rect x="-32" y="-30" width="64" height="54" rx="16" fill="url(#bubblePurple)" opacity="0.9"/>
    <!-- speech bubble pointer -->
    <path d="M 12 24 L 24 34 L 20 20 Z" fill="url(#bubblePurple)" opacity="0.9"/>
    <text x="0" y="7" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" text-anchor="middle">文</text>
  </g>

  <!-- Front Language Bubble 'A' -->
  <g transform="translate(330, 205)">
    <rect x="-30" y="-28" width="60" height="50" rx="16" fill="url(#bubbleBlue)"/>
    <path d="M -16 22 L -24 32 L -8 22 Z" fill="url(#bubbleBlue)"/>
    <text x="0" y="7" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle">A</text>
  </g>

  <!-- The Open Book Base (Symbolizing knowledge & memory storage) -->
  <!-- Left wing -->
  <path d="M 256 332 C 218 318 160 300 138 316 C 134 319 140 334 150 339 C 182 355 230 354 256 342 Z" fill="url(#bookLeft)"/>
  <path d="M 256 318 C 224 294 162 278 136 294 C 134 295 132 305 138 314 C 160 300 220 302 256 330 Z" fill="url(#bookLeft)"/>
  
  <!-- Right wing -->
  <path d="M 256 332 C 294 318 352 300 374 316 C 378 319 372 334 362 339 C 330 355 282 354 256 342 Z" fill="url(#bookRight)"/>
  <path d="M 256 318 C 288 294 350 278 376 294 C 378 295 380 305 374 314 C 352 300 292 302 256 330 Z" fill="url(#bookRight)"/>

  <!-- The Stylized White "7" (with squirrel-tail bookmark fold at the bottom) -->
  <g>
    <!-- Main "7" Top bar and diagonal stem -->
    <path d="M 160 148 
             C 160 136 170 128 184 128 
             L 294 128 
             C 304 128 312 134 310 144 
             C 309 148 306 153 302 158 
             L 242 270 
             C 230 292 216 316 256 330
             C 240 330 200 320 202 290
             L 248 178
             L 180 178
             C 168 178 160 166 160 148 Z" 
          fill="url(#numGrad)"/>
    <!-- Folded paper / ribbon effect on stem -->
    <path d="M 294 128 L 308 144 C 304 156 296 166 288 180 L 260 180 C 278 152 288 138 294 128 Z" fill="#e2e8f0" opacity="0.4"/>
    <path d="M 242 270 C 230 292 216 316 256 330 C 236 332 208 316 214 286 Z" fill="#cbd5e1" opacity="0.6"/>
  </g>

  <!-- Brand Typography "7ifd" -->
  <text x="256" y="420" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="-1.5" 
        text-anchor="middle">7ifd</text>

  <!-- Arabic Subtitle "حِفْظ" -->
  <text x="256" y="454" 
        fill="#94a3b8" 
        font-family="'Noto Sans Arabic', system-ui, sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="1" 
        text-anchor="middle">حِـفْـظ • SRS</text>
</svg>
